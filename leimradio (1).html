<!DOCTYPE html>
<!--
  LeimRadio — зацикленное 24/7 радио на плейлисте YouTube.

  ВАЖНО про "не играет": если открывать этот файл прямо с диска (двойным
  кликом, адрес будет начинаться с file://), YouTube IFrame API у многих
  браузеров тихо отказывается работать — ему нужен настоящий адрес
  http(s)://. Проверяй его так, как он будет жить на сайте:
    - залей на kozlocraft.github.io и открой по обычной ссылке, ИЛИ
    - локально: в папке с файлом выполни `python3 -m http.server`
      и открой http://localhost:8000/leimradio.html
  Ещё на всякий случай в коде добавлена авто-перемотка: если у конкретного
  видео на YouTube запрещено встраивание (бывает и такое), плеер сам
  перескочит на следующий трек, а не зависнет молча.

  КАК ВСТАВИТЬ НА САЙТ:
    <iframe src="/leimradio.html" allow="autoplay"
            style="width:100%;max-width:420px;height:520px;border:0"></iframe>
  Треки — в массиве TRACKS в конце файла (ID видео, часть ссылки после v=).
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeimRadio — эфир 24/7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0916;
    --panel:rgba(255,255,255,.045);
    --panel-edge:rgba(255,255,255,.10);
    --teal:#4fd8c4;
    --violet:#8b7bf0;
    --magenta:#ff5da2;
    --gold:#f4c15c;
    --ink:#0d0b1a;
    --text:#eae7fb;
    --text-dim:#948dc2;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse 800px 550px at 50% 20%, #191233 0%, var(--bg) 65%),
      var(--bg);
    font-family:'JetBrains Mono', monospace;
    padding:32px 16px;
    overflow:hidden;
  }

  .kc-stage{position:relative;width:100%;max-width:360px;}

  /* мягкое дрейфующее сияние-аврора позади карточки */
  .kc-aurora{
    position:absolute;
    inset:-60px;
    background:
      radial-gradient(circle at 25% 20%, rgba(79,216,196,.28), transparent 55%),
      radial-gradient(circle at 80% 15%, rgba(139,123,240,.25), transparent 55%),
      radial-gradient(circle at 55% 90%, rgba(255,93,162,.16), transparent 55%);
    filter:blur(30px);
    animation:kc-drift 22s ease-in-out infinite alternate;
    z-index:0;
  }
  @keyframes kc-drift{
    0%{transform:translate(-2%,0) scale(1);}
    100%{transform:translate(3%,-3%) scale(1.06);}
  }

  .kc-firefly{
    position:absolute;
    width:3px;height:3px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 6px 2px rgba(244,193,92,.7);
    animation:kc-flicker 4.5s ease-in-out infinite;
    z-index:0;
  }
  @keyframes kc-flicker{
    0%,100%{opacity:.15;transform:translateY(0);}
    50%{opacity:.9;transform:translateY(-8px);}
  }

  #kc-radio{
    position:relative;
    z-index:1;
    background:var(--panel);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--panel-edge);
    border-radius:22px;
    padding:22px 22px 26px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.08) inset,
      0 30px 60px -20px rgba(0,0,0,.7);
  }

  .kc-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .kc-wordmark{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    letter-spacing:.01em;
    background:linear-gradient(90deg, var(--text) 0%, var(--teal) 120%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .kc-badges{display:flex;gap:6px;}
  .kc-pill{
    display:flex;align-items:center;gap:5px;
    font-size:9px;letter-spacing:.14em;
    padding:4px 8px;
    border-radius:20px;
    border:1px solid var(--panel-edge);
    color:var(--text-dim);
  }
  .kc-pill.gold{color:var(--gold);border-color:rgba(244,193,92,.35);}
  .kc-dot{width:6px;height:6px;border-radius:50%;background:var(--magenta);}
  #kc-radio.playing .kc-dot{
    animation:kc-pulse 1.4s ease-in-out infinite;
    box-shadow:0 0 6px 1px var(--magenta);
  }
  @keyframes kc-pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

  .kc-vinyl-wrap{
    display:flex;
    justify-content:center;
    margin:6px 0 14px;
  }
  .kc-vinyl{
    position:relative;
    width:148px;height:148px;
    border-radius:50%;
    overflow:hidden;
    background:#050409;
    box-shadow:0 0 0 1px var(--panel-edge), 0 15px 30px -10px rgba(0,0,0,.7);
  }
  .kc-vinyl iframe{
    position:absolute;
    top:50%;left:50%;
    width:300px;height:300px;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .kc-grooves{
    position:absolute;inset:0;
    border-radius:50%;
    background:repeating-radial-gradient(circle, transparent 0 6px, rgba(0,0,0,.32) 6px 7px);
    mix-blend-mode:multiply;
    animation:kc-spin 9s linear infinite;
    animation-play-state:paused;
  }
  #kc-radio.playing .kc-grooves{animation-play-state:running;}
  @keyframes kc-spin{to{transform:rotate(360deg);}}
  .kc-label{
    position:absolute;
    top:50%;left:50%;
    width:46px;height:46px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffe3a8, var(--gold) 55%, #a97e2e 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:13px;
    color:var(--ink);
    box-shadow:0 0 0 3px rgba(5,4,9,.55), 0 2px 6px rgba(0,0,0,.5);
  }

  .kc-eq{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:4px;
    height:24px;
    margin-bottom:10px;
  }
  .kc-eq span{
    width:4px;
    height:20%;
    border-radius:2px;
    background:linear-gradient(180deg, var(--teal), var(--violet));
    opacity:.35;
  }
  #kc-radio.playing .kc-eq span{
    animation:kc-bar 1.1s ease-in-out infinite;
    opacity:1;
  }
  .kc-eq span:nth-child(1){animation-delay:-.9s;}
  .kc-eq span:nth-child(2){animation-delay:-.5s;}
  .kc-eq span:nth-child(3){animation-delay:-1.1s;}
  .kc-eq span:nth-child(4){animation-delay:-.2s;}
  .kc-eq span:nth-child(5){animation-delay:-.75s;}
  .kc-eq span:nth-child(6){animation-delay:-.35s;}
  .kc-eq span:nth-child(7){animation-delay:-1s;}
  @keyframes kc-bar{
    0%,100%{height:18%;}
    50%{height:100%;}
  }

  .kc-marquee-wrap{overflow:hidden;width:100%;margin-bottom:16px;}
  .kc-marquee{
    display:inline-block;
    font-size:11.5px;
    color:var(--text);
    padding-left:100%;
    white-space:nowrap;
  }
  #kc-radio.playing .kc-marquee{animation:kc-scroll 15s linear infinite;}
  @keyframes kc-scroll{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}

  .kc-controls{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .kc-btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:44px;height:44px;flex:0 0 auto;
    border-radius:50%;
    background:linear-gradient(160deg, var(--teal), var(--violet));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px -4px rgba(139,123,240,.55);
    transition:transform .08s ease;
  }
  .kc-btn:active{transform:scale(.93);}
  .kc-btn svg{width:19px;height:19px;fill:var(--ink);}

  input[type="range"]{
    -webkit-appearance:none;appearance:none;
    flex:1;height:3px;border-radius:3px;
    background:var(--panel-edge);
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px;height:13px;border-radius:50%;
    background:linear-gradient(160deg, var(--teal), var(--violet));
    box-shadow:0 1px 4px rgba(0,0,0,.5);
    cursor:pointer;margin-top:-5px;
  }
  input[type="range"]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;border:none;
    background:linear-gradient(160deg, var(--teal), var(--violet));
    cursor:pointer;
  }

  #kc-yt-host{position:absolute;width:0;height:0;overflow:hidden;}
</style>
</head>
<body>

<div class="kc-stage">
  <div class="kc-aurora"></div>
  <div class="kc-firefly" style="top:6%;left:12%;animation-delay:.2s;"></div>
  <div class="kc-firefly" style="top:80%;left:85%;animation-delay:1.4s;"></div>
  <div class="kc-firefly" style="top:15%;left:88%;animation-delay:2.6s;"></div>
  <div class="kc-firefly" style="top:70%;left:8%;animation-delay:3.3s;"></div>

  <div id="kc-radio">
    <div class="kc-head">
      <div class="kc-wordmark">LeimRadio</div>
      <div class="kc-badges">
        <div class="kc-pill"><span class="kc-dot"></span>ON AIR</div>
        <div class="kc-pill gold">24/7</div>
      </div>
    </div>

    <div class="kc-vinyl-wrap">
      <div class="kc-vinyl" id="kc-vinyl">
        <div class="kc-grooves"></div>
        <div class="kc-label">LR</div>
      </div>
    </div>

    <div class="kc-eq">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="kc-marquee-wrap"><div class="kc-marquee" id="kc-title">включаем эфир…</div></div>

    <div class="kc-controls">
      <button class="kc-btn" id="kc-mute" title="Звук вкл/выкл">
        <svg id="kc-mute-icon" viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.48 4.48 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </button>
      <input type="range" id="kc-vol" min="0" max="100" value="60">
    </div>
  </div>
</div>

<div id="kc-yt-host"><div id="kc-yt-player"></div></div>

<script>
  // ---- плейлист: ID видео YouTube (часть ссылки после v=) ----
  const TRACKS = [
    "4YIPrAs_5nE","4xGYu_6z_M0","ZzFu-ih05Zg","HxCbYeMXH68","s22PRxk1qIU",
    "zq1enzV6jMw","Pk8NU_Ja1io","tuUwxqcEpjM","f2B1R5CHu9Q","fm3nIK5hWdk",
    "LFO2_BfQ0io","rqGDIsWolAA","3ciVBYI9H4A","WBMnGoLmP64","gHK3RPgZjRk",
    "kzcaeH3BHUg","mSHuiXiIK6U","GwB2DgvS_Ys","YkZGUe6sfmY","KzqISznncDM",
    "FWBJNmryzJ4","7Aekc080xrk","2MMeeMNhpUU","MEmeVT15sjY","GXq_3CULKDE",
    "6StwyoDbMKE","eHKoKmM-IgQ","QOc5oe_-44A"
  ];

  const el = {
    radio: document.getElementById('kc-radio'),
    mute: document.getElementById('kc-mute'),
    muteIcon: document.getElementById('kc-mute-icon'),
    vol: document.getElementById('kc-vol'),
    title: document.getElementById('kc-title'),
  };

  let player, current = 0, isReady = false, unmuted = false;

  function loadYT(){
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);
  }

  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player('kc-yt-player', {
      height:'300', width:'300',
      videoId: TRACKS[current],
      playerVars:{ autoplay:1, mute:1, controls:0, disablekb:1, modestbranding:1, rel:0, playsinline:1 },
      events:{
        onReady: (e) => {
          isReady = true;
          document.getElementById('kc-vinyl').appendChild(e.target.getIframe());
          e.target.setVolume(Number(el.vol.value));
          e.target.mute();
          e.target.playVideo();
          updateTitle();
        },
        onStateChange: onPlayerState,
        onError: () => nextTrack() // видео недоступно/нельзя встроить — едем дальше без остановки
      }
    });
  };

  function onPlayerState(e){
    if(e.data === YT.PlayerState.PLAYING){
      updateTitle();
      refreshPlayingClass();
    } else if(e.data === YT.PlayerState.ENDED){
      nextTrack(); // плейлист закончился — начинаем сначала, эфир не прерывается
    }
  }

  function refreshPlayingClass(){
    const audible = unmuted && player.getPlayerState() === YT.PlayerState.PLAYING;
    el.radio.classList.toggle('playing', audible || player.getPlayerState() === YT.PlayerState.PLAYING);
  }

  function updateTitle(){
    let title = 'играет…';
    try{
      const data = player.getVideoData();
      if(data && data.title) title = data.title;
    }catch(err){}
    el.title.textContent = title;
    el.title.style.animation = 'none';
    void el.title.offsetWidth;
    el.title.style.animation = '';
  }

  function nextTrack(){
    current = (current + 1) % TRACKS.length; // бесконечный цикл, вручную не переключить
    if(!isReady) return;
    player.loadVideoById(TRACKS[current]);
    if(!unmuted) player.mute();
    setTimeout(updateTitle, 300);
  }

  el.mute.addEventListener('click', () => {
    if(!isReady) return;
    unmuted = !unmuted;
    if(unmuted){ player.unMute(); player.setVolume(Number(el.vol.value)); }
    else player.mute();
    el.muteIcon.innerHTML = unmuted
      ? '<path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.48 4.48 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>'
      : '<path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.94 8.94 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>';
  });

  el.vol.addEventListener('input', () => {
    if(isReady && unmuted) player.setVolume(Number(el.vol.value));
  });

  // подстраховка: если плеер по какой-то причине встал — пробуем снова
  setInterval(() => {
    if(!isReady) return;
    const st = player.getPlayerState();
    if(st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING){
      player.playVideo();
    }
  }, 4000);

  loadYT();
</script>
</body>
</html>
