<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e16">
  <link rel="icon" type="image/jpeg" href="leimradio_cover.jpg">
  <link rel="apple-touch-icon" href="leimradio_cover.jpg">
  <meta property="og:image" content="leimradio_cover.jpg">
  <title>LeimRadio — единый эфир</title>
  <style>
    :root {
      --bg: #090b11;
      --bg-soft: #111521;
      --card: rgba(19, 24, 35, .86);
      --card-strong: rgba(26, 32, 46, .96);
      --line: rgba(255, 255, 255, .11);
      --text: #f5f6fb;
      --muted: #9ea7ba;
      --muted-2: #70798e;
      --lime: #d8ff5f;
      --cyan: #70e8d1;
      --violet: #a496ff;
      --danger: #ff7f99;
      --shadow: rgba(0, 0, 0, .42);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 10%, rgba(112, 232, 209, .13), transparent 30rem),
        radial-gradient(circle at 90% 88%, rgba(164, 150, 255, .15), transparent 34rem),
        linear-gradient(145deg, #090b11 0%, #0b0e16 46%, #10121d 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 28px 16px;
      overflow-x: hidden;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: .22;
      pointer-events: none;
      content: "";
      background-image: radial-gradient(rgba(255,255,255,.28) .7px, transparent .7px);
      background-size: 5px 5px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }

    button, input { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
    }

    .radio-shell {
      width: min(100%, 480px);
      margin: 0 auto;
    }

    .radio-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(160deg, rgba(25, 31, 45, .96), rgba(13, 16, 25, .94));
      box-shadow: 0 32px 90px -30px var(--shadow), 0 1px 0 rgba(255,255,255,.08) inset;
    }

    .radio-card::after {
      position: absolute;
      width: 260px;
      height: 260px;
      right: -130px;
      bottom: -155px;
      border-radius: 50%;
      background: rgba(216, 255, 95, .1);
      filter: blur(18px);
      content: "";
      pointer-events: none;
    }

    .radio-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 22px 24px 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      letter-spacing: -.04em;
    }

    .brand-mark {
      display: grid;
      width: 37px;
      height: 37px;
      place-items: center;
      border-radius: 12px;
      color: #10140e;
      background: linear-gradient(145deg, var(--lime), var(--cyan));
      box-shadow: 0 8px 22px rgba(112, 232, 209, .16);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: -.08em;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: var(--muted-2);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 127, 153, .25);
      border-radius: 999px;
      color: #ffafbe;
      background: rgba(255, 127, 153, .08);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      white-space: nowrap;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 0 0 rgba(255, 127, 153, .55);
    }

    .is-playing .live-dot {
      animation: pulse 1.45s ease-out infinite;
    }

    @keyframes pulse {
      70% { box-shadow: 0 0 0 7px rgba(255, 127, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 127, 153, 0); }
    }

    .radio-content { padding: 18px 24px 25px; }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--lime);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .headline {
      margin: 0;
      font-size: clamp(25px, 7vw, 34px);
      line-height: 1.02;
      letter-spacing: -.055em;
    }

    .intro {
      max-width: 330px;
      margin: 10px 0 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .record-wrap {
      display: grid;
      place-items: center;
      margin: 4px 0 20px;
    }

    .record {
      position: relative;
      width: min(72vw, 264px);
      aspect-ratio: 1;
      overflow: hidden;
      border: 7px solid #171b27;
      border-radius: 50%;
      background:
        repeating-radial-gradient(circle at center, rgba(255,255,255,.06) 0 1px, transparent 1px 8px),
        radial-gradient(circle at 32% 26%, #31394c, #0b0d13 60%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.12),
        0 22px 50px -18px rgba(0,0,0,.86),
        0 0 70px rgba(112, 232, 209, .11);
    }

    .record::before {
      position: absolute;
      inset: 10%;
      z-index: 2;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .is-playing .record {
      animation: spin 9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Аудиодвижок работает незаметно: в интерфейсе нет чужих логотипов и элементов. */
    .audio-engine {
      position: fixed;
      top: -1000px;
      left: -1000px;
      width: 320px;
      height: 320px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }

    .audio-engine iframe {
      width: 320px;
      height: 320px;
      border: 0;
      opacity: 0;
    }

    .record-glow {
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: 50%;
      background: radial-gradient(circle at 31% 25%, rgba(255,255,255,.12), transparent 20%, transparent 62%, rgba(0,0,0,.38));
      pointer-events: none;
    }

    .record-label {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 4;
      display: grid;
      width: 78px;
      height: 78px;
      place-items: center;
      border: 5px solid #151822;
      border-radius: 50%;
      color: #171b12;
      background: linear-gradient(145deg, #f4ffa9, var(--lime) 54%, #89b43c);
      box-shadow: 0 2px 14px rgba(0,0,0,.48);
      transform: translate(-50%, -50%);
      font-size: 17px;
      font-weight: 950;
      letter-spacing: -.08em;
    }

    .record-label::after {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #172014;
      content: "";
    }

    .visualizer {
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 4px;
      height: 28px;
      margin: 0 auto 16px;
    }

    .visualizer span {
      width: 4px;
      height: 26%;
      border-radius: 99px;
      background: linear-gradient(to top, var(--violet), var(--cyan));
      opacity: .45;
    }

    .is-playing .visualizer span {
      animation: bars 1.05s ease-in-out infinite alternate;
      opacity: 1;
    }

    .visualizer span:nth-child(2) { animation-delay: -.8s; }
    .visualizer span:nth-child(3) { animation-delay: -.42s; }
    .visualizer span:nth-child(4) { animation-delay: -.12s; }
    .visualizer span:nth-child(5) { animation-delay: -.65s; }
    .visualizer span:nth-child(6) { animation-delay: -.28s; }
    .visualizer span:nth-child(7) { animation-delay: -.9s; }

    @keyframes bars {
      from { height: 20%; }
      to { height: 100%; }
    }

    .track-panel {
      min-height: 79px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(255,255,255,.035);
    }

    .track-label {
      margin-bottom: 7px;
      color: var(--muted-2);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .track-title {
      overflow: hidden;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-status {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    .listen-button {
      display: inline-flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 48px;
      padding: 0 16px;
      border-radius: 14px;
      color: #11150e;
      background: linear-gradient(135deg, var(--lime), var(--cyan));
      box-shadow: 0 10px 24px -12px rgba(216,255,95,.75);
      font-size: 13px;
      font-weight: 850;
      transition: transform .15s ease, filter .15s ease;
    }

    .listen-button:hover { filter: brightness(1.06); }
    .listen-button:active { transform: scale(.98); }
    .listen-button:disabled { cursor: wait; filter: grayscale(.25); opacity: .7; }

    .listen-button svg, .icon-button svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .icon-button {
      display: grid;
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: rgba(255,255,255,.055);
      transition: background .15s ease, transform .15s ease;
    }

    .icon-button:hover { background: rgba(255,255,255,.1); }
    .icon-button:active { transform: scale(.96); }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
      color: var(--muted-2);
    }

    .volume-row svg { width: 16px; height: 16px; fill: currentColor; }

    input[type="range"] {
      width: 100%;
      height: 4px;
      appearance: none;
      border-radius: 99px;
      outline: 0;
      background: linear-gradient(to right, var(--cyan) 0 60%, rgba(255,255,255,.13) 60% 100%);
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 14px;
      height: 14px;
      appearance: none;
      border: 2px solid var(--card-strong);
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 0 1px rgba(255,255,255,.24);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 2px solid var(--card-strong);
      border-radius: 50%;
      background: var(--cyan);
      cursor: pointer;
    }

    .radio-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
      color: var(--muted-2);
      font-size: 10px;
      line-height: 1.5;
    }

    .radio-footer span:last-child { color: var(--lime); }

    :focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 3px;
    }

    @media (max-width: 400px) {
      body { padding: 12px; }
      .radio-top, .radio-content { padding-left: 18px; padding-right: 18px; }
      .radio-top { align-items: flex-start; }
      .live-badge { padding: 7px 8px; font-size: 9px; }
      .headline { font-size: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    /* Минималистичный полноэкранный режим в духе lofi.radio. */
    body {
      min-height: 100svh;
      padding: 0;
      background:
        radial-gradient(circle at 50% 42%, rgba(126, 182, 158, .18), transparent 20rem),
        radial-gradient(circle at 12% 88%, rgba(87, 122, 124, .2), transparent 27rem),
        linear-gradient(145deg, #0b1718 0%, #102323 48%, #0b1518 100%);
    }

    .radio-shell {
      width: 100%;
      min-height: 100svh;
      display: grid;
      place-items: center;
    }

    .radio-card {
      width: min(100%, 860px);
      min-height: 100svh;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .radio-card::after { display: none; }

    .radio-top {
      position: absolute;
      top: 0;
      left: 50%;
      width: min(100%, 860px);
      padding: 28px 34px;
      transform: translateX(-50%);
    }

    .brand-mark {
      width: 31px;
      height: 31px;
      overflow: hidden;
      border-radius: 50%;
      font-size: 10px;
      box-shadow: none;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .brand-name {
      font-size: 16px;
      letter-spacing: -.03em;
    }

    .brand-subtitle {
      color: rgba(225, 239, 230, .48);
      font-size: 9px;
      letter-spacing: .16em;
    }

    .live-badge {
      border: 0;
      padding: 0;
      color: rgba(225, 239, 230, .55);
      background: transparent;
      font-size: 9px;
      letter-spacing: .16em;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      background: #c6e4ae;
    }

    .radio-content {
      display: flex;
      min-height: 100svh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 124px 24px 48px;
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 12px;
      color: rgba(201, 230, 191, .72);
      font-size: 9px;
      letter-spacing: .22em;
    }

    .headline {
      color: #edf5e7;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 8vw, 68px);
      font-weight: 400;
      letter-spacing: -.065em;
      line-height: .98;
    }

    .intro {
      max-width: 320px;
      margin: 18px 0 28px;
      color: rgba(225, 239, 230, .58);
      font-size: 12px;
      line-height: 1.65;
    }

    .record-wrap {
      margin: 4px 0 26px;
    }

    .record {
      width: min(65vw, 310px);
      border: 0;
      background:
        radial-gradient(circle at 32% 25%, rgba(237, 255, 212, .64), transparent 4%),
        repeating-radial-gradient(circle, rgba(216, 240, 203, .13) 0 1px, transparent 1px 8px),
        radial-gradient(circle at 48% 44%, #47746c 0%, #294d4d 38%, #12272c 72%);
      box-shadow:
        0 0 0 1px rgba(215, 240, 210, .17),
        0 26px 70px -24px rgba(0, 0, 0, .82),
        0 0 100px rgba(133, 195, 167, .13);
    }

    .cover-image {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .86;
      filter: saturate(.7) contrast(1.05) brightness(.72);
    }

    .record::before {
      inset: 6%;
      border-color: rgba(225, 248, 217, .12);
    }

    .record-glow {
      background:
        radial-gradient(circle at 31% 25%, rgba(255,255,255,.18), transparent 18%),
        radial-gradient(circle at center, transparent 42%, rgba(3, 15, 18, .45) 100%);
    }

    .record-label {
      width: 74px;
      height: 74px;
      border-color: rgba(16, 32, 31, .72);
      color: #19302c;
      background: linear-gradient(145deg, #ebf5ba, #c9e49d 58%, #89b487);
      font-size: 15px;
    }

    .visualizer {
      height: 20px;
      margin-bottom: 18px;
      opacity: .82;
    }

    .track-panel {
      min-height: 0;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .track-label { display: none; }

    .track-title {
      color: rgba(237, 245, 231, .86);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: .01em;
    }

    .track-status {
      color: rgba(225, 239, 230, .48);
      font-size: 10px;
      letter-spacing: .04em;
    }

    .controls {
      width: min(100%, 300px);
      justify-content: center;
      margin-top: 20px;
    }

    .listen-button {
      min-height: 47px;
      border: 1px solid rgba(225, 244, 215, .23);
      border-radius: 999px;
      color: #eaf5e2;
      background: rgba(225, 244, 215, .09);
      box-shadow: 0 14px 34px -18px rgba(147, 210, 170, .55);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .listen-button:hover { background: rgba(225, 244, 215, .15); }

    .volume-row {
      width: min(100%, 250px);
      margin-top: 19px;
      color: rgba(225, 239, 230, .44);
    }

    .radio-footer {
      justify-content: center;
      margin-top: 28px;
      color: rgba(225, 239, 230, .36);
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .radio-footer span:last-child { display: none; }

    @media (max-width: 400px) {
      .radio-top { padding: 22px 20px; }
      .radio-content { padding-right: 20px; padding-left: 20px; }
      .headline { font-size: 40px; }
    }
  </style>
</head>
<body>
  <main class="radio-shell">
    <section class="radio-card" id="radio" aria-label="LeimRadio">
      <header class="radio-top">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <img src="leimradio_cover.jpg" alt="">
          </div>
          <div>
            <div class="brand-name">LeimRadio</div>
            <div class="brand-subtitle">музыка без пауз</div>
          </div>
        </div>
        <div class="live-badge"><span class="live-dot"></span><span>LIVE</span></div>
      </header>

      <div class="radio-content">
        <p class="eyebrow">LEIM / LISTENING SPACE</p>
        <div class="record-wrap">
          <div class="record" aria-label="Обложка текущего трека">
            <img class="cover-image" src="leimradio_cover.jpg" alt="Обложка LeimRadio">
            <div class="record-glow"></div>
            <div class="record-label">LR</div>
          </div>
        </div>

        <div class="visualizer" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>

        <div class="track-panel">
          <div class="track-title" id="track-title">LeimRadio</div>
          <div class="track-status" id="track-status" aria-live="polite">Загрузка эфира</div>
        </div>

        <div class="controls">
          <button class="listen-button" id="listen-button" type="button" disabled>
            <svg id="listen-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5.14v13.72a1 1 0 0 0 1.52.86l10.1-6.86a1 1 0 0 0 0-1.72L9.52 4.28A1 1 0 0 0 8 5.14Z"/>
            </svg>
            <span id="listen-label">Загрузка…</span>
          </button>
        </div>

        <label class="volume-row" for="volume">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 9v6h4l5 4V5L7 9H3Zm12.5 3A3.5 3.5 0 0 0 14 8.88v6.24A3.5 3.5 0 0 0 15.5 12Zm0-7.32v2.06A5.49 5.49 0 0 1 19 12a5.49 5.49 0 0 1-3.5 5.26v2.06A7.5 7.5 0 0 0 21 12a7.5 7.5 0 0 0-5.5-7.32Z"/>
          </svg>
          <input id="volume" type="range" min="0" max="100" value="60" aria-label="Громкость">
        </label>

        <footer class="radio-footer">
          <span>Эфир синхронизирован</span>
          <span>LEIM / RADIO</span>
        </footer>
      </div>
    </section>
  </main>
  <div id="yt-player" class="audio-engine" aria-hidden="true"></div>

  <script>
    // Аудиотреки исходного плейлиста LeimRadio.
    const TRACKS = [
      "4YIPrAs_5nE", "4xGYu_6z_M0", "ZzFu-ih05Zg", "HxCbYeMXH68",
      "s22PRxk1qIU", "zq1enzV6jMw", "Pk8NU_Ja1io", "tuUwxqcEpjM",
      "f2B1R5CHu9Q", "fm3nIK5hWdk", "LFO2_BfQ0io", "rqGDIsWolAA",
      "3ciVBYI9H4A", "WBMnGoLmP64", "gHK3RPgZjRk", "kzcaeH3BHUg",
      "mSHuiXiIK6U", "GwB2DgvS_Ys", "YkZGUe6sfmY", "KzqISznncDM",
      "FWBJNmryzJ4", "7Aekc080xrk", "2MMeeMNhpUU", "MEmeVT15sjY",
      "GXq_3CULKDE", "6StwyoDbMKE", "eHKoKmM-IgQ", "QOc5oe_-44A",
      "hkkBiXS6A7o", "fS7TdffAX24", "3_soAloXjEg", "ufHwQp3skvo",
      "WeukNEz3jZw", "Dp7G6BeH2UA", "fdePETDiJTI", "gksgRYcg5rk"
    ];

    const radio = document.getElementById("radio");
    const listenButton = document.getElementById("listen-button");
    const listenIcon = document.getElementById("listen-icon");
    const listenLabel = document.getElementById("listen-label");
    const volume = document.getElementById("volume");
    const title = document.getElementById("track-title");
    const status = document.getElementById("track-status");
    const SYNC_API = "/api";

    let player = null;
    let currentTrack = 0;
    let loadedTrack = -1;
    let apiReady = false;
    let userStarted = false;
    let muted = true;
    let trackAttempts = 0;
    let retryTimer = null;
    let syncTimer = null;
    let syncInFlight = false;
    let advanceInFlight = false;
    let startRequestActive = false;
    let clockOffset = 0;
    let pendingOffset = 0;

    const ICONS = {
      play: '<path d="M8 5.14v13.72a1 1 0 0 0 1.52.86l10.1-6.86a1 1 0 0 0 0-1.72L9.52 4.28A1 1 0 0 0 8 5.14Z"/>',
      volume: '<path d="M3 9v6h4l5 4V5L7 9H3Zm12.5 3A3.5 3.5 0 0 0 14 8.88v6.24A3.5 3.5 0 0 0 15.5 12Zm0-7.32v2.06A5.49 5.49 0 0 1 19 12a5.49 5.49 0 0 1-3.5 5.26v2.06A7.5 7.5 0 0 0 21 12a7.5 7.5 0 0 0-5.5-7.32Z"/>',
      muted: '<path d="m4.27 3 16.46 16.46-1.41 1.41-3.05-3.05A7.6 7.6 0 0 1 14 18.74v-2.07c.56-.17 1.09-.43 1.57-.76L12 12.34V19l-5-4H3V9h3.73L2.86 5.14 4.27 3ZM14 3.26a9.02 9.02 0 0 1 7 8.74c0 1.15-.21 2.25-.6 3.27l-1.57-1.57c.11-.55.17-1.11.17-1.7a7.02 7.02 0 0 0-5-6.71V3.26Z"/>'
    };

    function setStatus(message) {
      status.textContent = message;
    }

    function setVolumeFill() {
      const value = Number(volume.value);
      volume.style.background = "linear-gradient(to right, var(--cyan) 0 " + value + "%, rgba(255,255,255,.13) " + value + "% 100%)";
    }

    function updateButton() {
      const playing = player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING;
      listenIcon.innerHTML = playing && !muted ? ICONS.muted : ICONS.play;
      listenLabel.textContent = playing && !muted ? "Выключить звук" : "Включить эфир";
      radio.classList.toggle("is-playing", Boolean(playing));
    }

    function updateTrackTitle() {
      title.textContent = "LeimRadio";
    }

    async function reportDuration() {
      if (!player || !apiReady || loadedTrack < 0) return;
      const duration = Number(player.getDuration());
      if (!Number.isFinite(duration) || duration < 2) return;
      try {
        await fetch(SYNC_API + "/duration", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ index: loadedTrack, duration })
        });
      } catch (error) {
        // Следующая синхронизация повторит отправку.
      }
    }

    function loadTrack(index, offset) {
      if (!player || !apiReady) return;
      currentTrack = (index + TRACKS.length) % TRACKS.length;
      loadedTrack = currentTrack;
      trackAttempts += 1;
      pendingOffset = Math.max(0, Number(offset) || 0);
      title.textContent = "LeimRadio";
      setStatus("Синхронизируем эфир…");
      player.loadVideoById({ videoId: TRACKS[currentTrack], suggestedQuality: "small" });
      if (muted) player.mute();
      else player.unMute();
      window.setTimeout(function () {
        if (pendingOffset > 0 && player.getDuration() > pendingOffset) {
          player.seekTo(pendingOffset, true);
          pendingOffset = 0;
        }
        reportDuration();
        updateTrackTitle();
      }, 900);
    }

    async function advanceSharedTrack() {
      if (advanceInFlight) return;
      advanceInFlight = true;
      try {
        await fetch(SYNC_API + "/advance", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ index: currentTrack, failed: true })
        });
      } catch (error) {
        // Polling восстановит связь и получит актуальный эфир.
      } finally {
        advanceInFlight = false;
      }
      syncFromServer(true);
    }

    function onPlayerError() {
      window.clearTimeout(retryTimer);
      retryTimer = window.setTimeout(function () {
        advanceSharedTrack();
      }, 350);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        trackAttempts = 0;
        if (!muted) userStarted = true;
        setStatus(muted ? "Эфир готов" : "Эфир играет");
        if (pendingOffset > 0 && player.getDuration() > pendingOffset) {
          player.seekTo(pendingOffset, true);
          pendingOffset = 0;
        }
        reportDuration();
        updateTrackTitle();
        updateButton();
      } else if (event.data === YT.PlayerState.BUFFERING) {
        setStatus("Буферизация…");
      } else if (event.data === YT.PlayerState.ENDED) {
        advanceSharedTrack();
      } else if (event.data === YT.PlayerState.PAUSED && userStarted) {
        setStatus("Эфир на паузе");
        updateButton();
      }
    }

    async function startSharedAir() {
      if (!player || !apiReady) return;
      if (startRequestActive) return;
      const duration = Number(player.getDuration());
      if (!Number.isFinite(duration) || duration < 2) {
        setStatus("Подготавливаем эфир…");
        startRequestActive = true;
        window.setTimeout(function () {
          startRequestActive = false;
          startSharedAir();
        }, 500);
        return;
      }
      startRequestActive = true;
      try {
        await fetch(SYNC_API + "/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ index: currentTrack, duration })
        });
        await syncFromServer(true);
      } catch (error) {
        setStatus("Подключение к эфиру прервано…");
      } finally {
        startRequestActive = false;
      }
    }

    async function syncFromServer(force) {
      if (!player || !apiReady) return;
      if (syncInFlight) return;
      syncInFlight = true;
      try {
        const response = await fetch(SYNC_API + "/state", { cache: "no-store" });
        if (!response.ok) throw new Error("sync");
        const shared = await response.json();
        clockOffset = Number(shared.now) - Date.now();
        const elapsed = shared.active && shared.duration > 0
          ? Math.max(0, (Date.now() + clockOffset - Number(shared.startedAt)) / 1000)
          : 0;
        const localState = player.getPlayerState();
        const localTime = Number(player.getCurrentTime ? player.getCurrentTime() : 0);
        const needsNewTrack = loadedTrack !== Number(shared.index);
        const needsSeek = shared.active && localState === YT.PlayerState.PLAYING && Math.abs(localTime - elapsed) > 4;

        if (force || needsNewTrack) {
          loadTrack(Number(shared.index), elapsed);
        } else if (needsSeek) {
          player.seekTo(elapsed, true);
        }

        if (shared.active && shared.duration > 0 && elapsed >= Number(shared.duration)) {
          advanceSharedTrack();
        } else if (!userStarted) {
          setStatus("Готово. Нажмите «Включить эфир».");
        } else {
          setStatus("Эфир синхронизирован");
        }
      } catch (error) {
        setStatus("Подключение к эфиру прервано…");
      } finally {
        syncInFlight = false;
      }
    }

    function startSync() {
      if (syncTimer) return;
      syncTimer = window.setInterval(function () {
        syncFromServer(false);
      }, 2500);
    }

    window.onYouTubeIframeAPIReady = function () {
      apiReady = true;
      player = new YT.Player("yt-player", {
        width: "320",
        height: "320",
        videoId: TRACKS[currentTrack],
        playerVars: {
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          modestbranding: 1,
          playsinline: 1,
          rel: 0
        },
        events: {
          onReady: function (event) {
            listenButton.disabled = false;
            event.target.setVolume(Number(volume.value));
            event.target.mute();
            setStatus("Готово. Нажмите «Включить эфир».");
            updateTrackTitle();
            updateButton();
            syncFromServer(true);
            startSync();
          },
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    };

    listenButton.addEventListener("click", function () {
      if (!player || !apiReady) {
        setStatus("Подключаем эфир…");
        return;
      }

      const state = player.getPlayerState();
      const playing = state === YT.PlayerState.PLAYING;

      if (!playing) {
        userStarted = true;
        muted = false;
        player.setVolume(Number(volume.value));
        player.unMute();
        player.playVideo();
        setStatus("Подключаемся к общему эфиру…");
        startSharedAir();
      } else if (muted) {
        userStarted = true;
        muted = false;
        player.setVolume(Number(volume.value));
        player.unMute();
        setStatus("Звук включён");
        startSharedAir();
      } else {
        muted = true;
        player.mute();
        setStatus("Эфир продолжает играть без звука");
      }
      updateButton();
    });

    volume.addEventListener("input", function () {
      const value = Number(volume.value);
      setVolumeFill();
      if (player && apiReady) {
        player.setVolume(value);
        if (value > 0 && !muted && player.getPlayerState() === YT.PlayerState.PLAYING) {
          player.unMute();
        }
      }
    });

    setVolumeFill();

    const youtubeApi = document.createElement("script");
    youtubeApi.src = "https://www.youtube.com/iframe_api";
    youtubeApi.async = true;
    document.head.appendChild(youtubeApi);

    window.setTimeout(function () {
      if (!apiReady) {
        setStatus("Эфир не загрузился. Откройте страницу через интернет или сервер.");
        title.textContent = "LeimRadio • эфир на паузе";
        listenButton.disabled = false;
        listenLabel.textContent = "Повторить";
      }
    }, 10000);
  </script>
</body>
</html>
